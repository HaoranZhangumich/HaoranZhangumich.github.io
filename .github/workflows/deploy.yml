name: Deploy site

# The site is plain static files (index.html + assets/), so there is no build:
# copy the public files into _site/ and publish them to the gh-pages branch,
# which GitHub Pages serves.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage the static site
        run: |
          mkdir -p _site
          cp -R index.html 404.html robots.txt assets _site/
          touch _site/.nojekyll
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          single-commit: true
