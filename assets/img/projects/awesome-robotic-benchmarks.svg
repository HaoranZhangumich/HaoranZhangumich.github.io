    </g>
    <line x1="76" y1="252" x2="644" y2="252" stroke="#ece6d8" stroke-width="2"/>
    <g transform="translate(76 282)">
      <rect width="14" height="14" rx="4" y="-12" fill="#c9a24b"/>
      <text x="28" y="0">Simulators and environments</text>
    </g>
    <line x1="76" y1="304" x2="644" y2="304" stroke="#ece6d8" stroke-width="2"/>
    <g transform="translate(76 334)">
      <rect width="14" height="14" rx="4" y="-12" fill="#163c63"/>
      <text x="28" y="0">Datasets for evaluation</text>
    </g>
    <line x1="76" y1="356" x2="644" y2="356" stroke="#ece6d8" stroke-width="2"/>
    <g transform="translate(76 386)">
      <rect width="14" height="14" rx="4" y="-12" fill="#e5c687"/>
